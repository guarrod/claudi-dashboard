# Pegar dentro del bloque server { listen 443 ssl; server_name guarrod.com ... }
# El hub solo escucha en 127.0.0.1:8788; nginx le pone TLS y limita el abuso.
location = /claude-hub { return 404; }
location /claude-hub/ {
    limit_except GET POST { deny all; }
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
# Recomendado (en http { }): limit_req_zone $binary_remote_addr zone=claudehub:1m rate=30r/m;
# y dentro del location:   limit_req zone=claudehub burst=20 nodelay;
